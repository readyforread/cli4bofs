name: Build cli4bofs (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. Скачиваем исходный код репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Настраиваем окружение Python (убрана строка cache: 'pip', вызывавшая ошибку)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Устанавливаем зависимости для работы Python-скрипта
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml requests

    # 4. Запускаем скрипт загрузки сторонних BOF-файлов
    - name: Fetch 3rd party BOFs
      run: |
        python fetch-3rdparty-BOFs.py

    # 5. Устанавливаем компилятор Zig
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    # 6. Проверяем корректность установки Zig
    - name: Verify Zig installation
      run: zig version

    # 7. Собираем проект под Windows
    - name: Build project for Windows
      run: |
        zig build --summary all

    # 8. Сохраняем скомпилированные .exe файлы в артефакты GitHub
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cli4bofs-windows-binaries
        path: |
          zig-out/bin/*.exe
        if-no-files-found: warn
